service: festival-check-in
frameworkVersion: "3.40.0"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION}
  stage: ${env:FCI_EQUIPO}
  iam:
    role: ${env:LAMBDA_ROLE_ARN}
  environment:
    FCI_TABLA_EVENTOS:
      Ref: FestivalCheckInEventos
    FCI_TABLA_INSCRIPCIONES:
      Ref: FestivalCheckInInscripciones
    FCI_TABLA_USUARIOS:
      Ref: FestivalCheckInUsuarios
    #Nuevas tablas
    TABLA_EMPRESAS: { Ref: TablaEmpresas }
    TABLA_PROYECTOS: { Ref: TablaProyectos }
  httpApi:
    payload: '2.0'
    cors:
      allowedOrigins:
        - https://albertohdezakkari.github.io
      allowedHeaders:
        - Content-Type
      allowedMethods:
        - GET
        - POST

package:
  patterns:
    - "!scripts/**"
    - "!README.md"
    - "!.env*"

functions:
  crearEvento:
    name: ${self:service}-${self:provider.stage}-crearEvento
    handler: src/eventos/crear-evento/handler.handler
    events:
      - httpApi:
          method: POST
          path: /events
  buscarEvento:
    name: ${self:service}-${self:provider.stage}-buscarEvento
    handler: src/eventos/buscar-evento/handler.buscarEventoHandler
    events:
      - httpApi:
          method: GET
          path: /events/{eventId}
  listarEventos:
    name: ${self:service}-${self:provider.stage}-listarEventos
    handler: src/eventos/listar-eventos/handler.listarEventosHandler
    events:
      - httpApi:
          method: GET
          path: /events
  crearUsuario:
    name: ${self:service}-${self:provider.stage}-crearUsuario
    handler: src/usuarios/crear-usuario/handler.handler
    events:
      - httpApi:
          method: POST
          path: /users
  consultarInscripcion:
    handler: src/inscripciones/consultar-inscripcion/handler.handler
    events:
      - httpApi:
          method: GET
          path: /events/{eventId}/registrations/{userId}
  inscribirUsuario:
    handler: src/inscripciones/inscribir-usuario/handler.handler
    events:
      - httpApi:
          method: POST
          path: /events/{eventId}/registrations
      - httpApi:
          method: POST
          path: /events/{eventId}/registrations/{userId}
    
 # FUNCIONES NUEVAS
  crearProyecto:
    handler: src/proyectos/crear-listar/handler.crearHandler
    events:
      - httpApi: { method: POST, path: /proyectos }
  listarProyectos:
    handler: src/proyectos/crear-listar/handler.listarHandler
    events:
      - httpApi: { method: GET, path: /proyectos }
  eliminarProyecto:
    handler: src/proyectos/eliminar/handler.handler
    events:
      - httpApi: { method: DELETE, path: /proyectos/{proyectoId} }
  modificarHorasEstimadas:
    handler: src/proyectos/modificar-horas-estimadas/handler.handler
    events:
      - httpApi: { method: PATCH, path: /proyectos/{proyectoId} }
  trasladarProyecto:
    handler: src/proyectos/trasladar/handler.handler
    events:
      - httpApi: { method: PATCH, path: /proyectos/{proyectoId}/empresa }
  consultarEmpresa:
    handler: src/empresas/consultar/handler.handler
    events:
      - httpApi: { method: GET, path: /empresas/{empresaId}/proyectos }

resources:
  Resources:
    FestivalCheckInEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FCI_EVENTOS_${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: EVENT_ID
            AttributeType: N
        KeySchema:
          - AttributeName: EVENT_ID
            KeyType: HASH
    FestivalCheckInInscripciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FCI_INSCRIPCIONES_${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: EVENT_ID
            AttributeType: N
          - AttributeName: USER_ID
            AttributeType: S
        KeySchema:
          - AttributeName: EVENT_ID
            KeyType: HASH
          - AttributeName: USER_ID
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: PorUsuario
            KeySchema:
              - AttributeName: USER_ID
                KeyType: HASH
              - AttributeName: EVENT_ID
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
    FestivalCheckInUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FCI_USUARIOS_${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: USER_ID
            AttributeType: S
        KeySchema:
          - AttributeName: USER_ID
            KeyType: HASH
    #TABLAS NUEVAS
    TablaEmpresas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: EMPRESAS
        # PARTITION KEY: EMPRESA_ID (N: número).
        # CAMPOS NO CLAVE de esta tabla (fuera de su PK):
        #   NOMBRE (S: texto).
        # Sus tipos se describen en MODELO_EMPRESA.
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: EMPRESA_ID, AttributeType: N }
        KeySchema:
          - AttributeName: EMPRESA_ID
            KeyType: HASH  # Partition key del lado 1.

      TablaProyectos:
        Type: AWS::DynamoDB::Table
        Properties:
          TableName: PROYECTOS
          # PARTITION KEY: PROYECTO_ID (N: número).
          # CAMPOS NO CLAVE de esta tabla (fuera de su PK):
          #   NOMBRE (S: texto).
          #   HORAS_ESTIMADAS (N: número).
          #   EMPRESA_ID (N: referencia y clave del GSI).
          # Sus tipos se describen en MODELO_PROYECTO.
          BillingMode: PAY_PER_REQUEST
          AttributeDefinitions:  # N = número. Declara las claves.
            - { AttributeName: PROYECTO_ID, AttributeType: N }
            - { AttributeName: EMPRESA_ID, AttributeType: N }
          KeySchema:
            - AttributeName: PROYECTO_ID
              KeyType: HASH  # Partition key del lado N.
               # GSI: segunda forma de buscar en PROYECTOS.
               # Global: agrupa todo el lado N por su referencia.
          GlobalSecondaryIndexes:
            - IndexName: PorEmpresa
              # Clave compuesta = partition key + sort key:
              # (EMPRESA_ID, PROYECTO_ID), los dos valores juntos.
              KeySchema:
                - AttributeName: EMPRESA_ID
                  KeyType: HASH   # Partition key. Agrupa por Empresa.
                - AttributeName: PROYECTO_ID
                  KeyType: RANGE  # Sort key. Ordena por ID.
                  Projection:
                  ProjectionType: INCLUDE  # Claves + campos de abajo.
                  NonKeyAttributes:        # Campos de PROYECTOS copiados al índice.
                    - NOMBRE
                    - HORAS_ESTIMADAS

  Outputs:
    NombreTablaEventosFCI:
      Value:
        Ref: FestivalCheckInEventos
    NombreTablaInscripcionesFCI:
      Value:
        Ref: FestivalCheckInInscripciones
    NombreTablaUsuariosFCI:
      Value:
        Ref: FestivalCheckInUsuarios
